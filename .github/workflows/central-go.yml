name: go-modules

on:
  push:
    paths:
      - "central/**"
      - "companion/**"
      - ".github/workflows/central-go.yml"
  pull_request:
    paths:
      - "central/**"
      - "companion/**"
      - ".github/workflows/central-go.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [central, companion]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false

      - name: Formatação (gofmt)
        run: test -z "$(gofmt -l .)"

      - name: Análise estática (go vet)
        run: go vet ./...

      - name: Análise estática (staticcheck)
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Build
        run: go build ./...

      - name: Testes com detector de corrida
        run: go test -race -count=1 ./...

      - name: Vulnerabilidades (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    name: frontend (companion desktop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion/desktop/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Component tests (vitest, primary flows)
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (shell navigation and fallbacks)
        run: npm run e2e
