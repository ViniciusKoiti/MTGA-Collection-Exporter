name: Windows Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build Windows zip
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Lint
        run: ruff check mtga tests

      - name: Test
        run: pytest --cov=mtga --cov-report=term-missing

      - name: Build package
        shell: pwsh
        run: ./scripts/package_windows.ps1 -Clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTGA-Exporter-windows
          path: dist/MTGA-Exporter-windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = "${{ github.ref_name }}"
          $ZipPath = "dist/MTGA-Exporter-windows.zip"
          if (gh release view $Tag) {
            gh release upload $Tag $ZipPath --clobber
          } else {
            gh release create $Tag $ZipPath --title "MTGA Exporter $Tag" --notes "Pacote Windows gerado automaticamente pela pipeline."
          }
